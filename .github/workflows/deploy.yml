name: Deploy

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server
      - run: cargo build --release
        working-directory: server

      - name: Copy frontend to server static
        run: |
          rm -rf server/static
          mkdir -p server/static
          cp -r dist/* server/static/

      - name: Setup SSH
        env:
          SSH_KEY: ${{ secrets.HOMEBASE_SSH_KEY }}
          SSH_PASSPHRASE: ${{ secrets.HOMEBASE_SSH_PASSPHRASE }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          eval "$(ssh-agent -s)"
          echo "echo \$SSH_PASSPHRASE" > /tmp/askpass.sh
          chmod +x /tmp/askpass.sh
          DISPLAY=:0 SSH_ASKPASS=/tmp/askpass.sh SSH_ASKPASS_REQUIRE=force ssh-add ~/.ssh/deploy_key
          rm /tmp/askpass.sh
          ssh-keyscan -H 159.203.121.3 >> ~/.ssh/known_hosts 2>/dev/null
          echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK" >> $GITHUB_ENV

      - name: Deploy to homebase
        run: |
          # Create deploy directory
          ssh root@159.203.121.3 "mkdir -p /opt/heavy-ball/static"

          # Upload binary and static files
          scp server/target/release/heavy-ball-server root@159.203.121.3:/opt/heavy-ball/heavy-ball-server.new
          rsync -az --delete server/static/ root@159.203.121.3:/opt/heavy-ball/static/

          # Swap binary and restart
          ssh root@159.203.121.3 "
            mv /opt/heavy-ball/heavy-ball-server.new /opt/heavy-ball/heavy-ball-server
            chmod +x /opt/heavy-ball/heavy-ball-server
            systemctl restart heavy-ball
          "
