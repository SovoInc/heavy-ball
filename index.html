<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Heavy Ball</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html, body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #111;
        font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
        color: #fff;
      }
      #game-canvas {
        position: absolute;
        top: 0;
        left: 0;
        display: block;
        width: 100%;
        height: 100%;
      }
      #hud {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
      }
      #hud > * {
        pointer-events: auto;
      }
      #hud-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 16px 24px;
      }
      #hud-level {
        font-size: 18px;
        font-weight: 600;
        text-shadow: 0 2px 8px rgba(0,0,0,0.6);
      }
      #hud-timer {
        font-size: 22px;
        font-weight: 700;
        font-variant-numeric: tabular-nums;
        text-shadow: 0 2px 8px rgba(0,0,0,0.6);
      }
      #hud-restart {
        background: rgba(255,255,255,0.12);
        border: 1px solid rgba(255,255,255,0.2);
        color: #fff;
        padding: 6px 16px;
        border-radius: 6px;
        cursor: pointer;
        font-size: 14px;
        backdrop-filter: blur(8px);
        transition: background 0.2s;
      }
      #hud-restart:hover {
        background: rgba(255,255,255,0.22);
      }
      #overlay {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: rgba(0,0,0,0.65);
        backdrop-filter: blur(12px);
        z-index: 10;
        pointer-events: auto;
      }
      #overlay.hidden {
        display: none;
      }
      #overlay h1 {
        font-size: 48px;
        font-weight: 800;
        margin-bottom: 8px;
        letter-spacing: -1px;
      }
      #overlay p {
        font-size: 18px;
        opacity: 0.7;
        margin-bottom: 32px;
      }
      #alias-input {
        padding: 10px 18px;
        border-radius: 8px;
        border: 1px solid rgba(255,255,255,0.3);
        background: rgba(255,255,255,0.1);
        color: #fff;
        font-size: 16px;
        text-align: center;
        margin-bottom: 16px;
        outline: none;
        width: 200px;
      }
      #alias-input::placeholder {
        color: rgba(255,255,255,0.4);
      }
      #leaderboard-panel {
        display: none;
        max-height: 300px;
        overflow-y: auto;
        margin: 16px 0;
        width: 320px;
      }
      #leaderboard-panel table {
        width: 100%;
        border-collapse: collapse;
        font-size: 14px;
      }
      #leaderboard-panel th, #leaderboard-panel td {
        padding: 6px 10px;
        text-align: left;
      }
      #leaderboard-panel th {
        opacity: 0.6;
        font-weight: 600;
        border-bottom: 1px solid rgba(255,255,255,0.15);
      }
      #leaderboard-panel td {
        border-bottom: 1px solid rgba(255,255,255,0.06);
      }
      #stats-panel {
        display: none;
        font-size: 14px;
        opacity: 0.8;
        margin: 12px 0;
      }
      .overlay-btn {
        background: #fff;
        color: #111;
        border: none;
        padding: 12px 36px;
        border-radius: 8px;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
        margin: 6px;
        transition: transform 0.15s, box-shadow 0.15s;
      }
      .overlay-btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 4px 20px rgba(255,255,255,0.2);
      }
      .overlay-btn.secondary {
        background: rgba(255,255,255,0.15);
        color: #fff;
        border: 1px solid rgba(255,255,255,0.25);
      }
      #hud-powerups {
        position: absolute;
        bottom: 80px;
        left: 24px;
        display: flex;
        flex-direction: column;
        gap: 6px;
        pointer-events: none;
      }
      .powerup-indicator {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 13px;
        font-weight: 600;
        text-shadow: 0 1px 4px rgba(0,0,0,0.6);
      }
      .powerup-bar {
        width: 60px;
        height: 4px;
        background: rgba(255,255,255,0.15);
        border-radius: 2px;
        overflow: hidden;
      }
      .powerup-bar-fill {
        height: 100%;
        border-radius: 2px;
        transition: width 0.1s linear;
      }
      #hud-toast {
        position: absolute;
        top: 60px;
        left: 50%;
        transform: translateX(-50%);
        font-size: 16px;
        font-weight: 700;
        text-shadow: 0 2px 8px rgba(0,0,0,0.6);
        opacity: 0;
        transition: opacity 0.3s;
        pointer-events: none;
      }
      #hud-toast.show {
        opacity: 1;
      }
      #controls-hint {
        position: absolute;
        bottom: 24px;
        left: 50%;
        transform: translateX(-50%);
        font-size: 13px;
        opacity: 0.5;
        text-shadow: 0 1px 4px rgba(0,0,0,0.5);
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <canvas id="game-canvas"></canvas>
    <div id="hud">
      <div id="hud-top">
        <div id="hud-level">Level 1</div>
        <div id="hud-timer">00:00.0</div>
        <button id="hud-restart">Give Up</button>
      </div>
      <div id="hud-powerups"></div>
      <div id="hud-toast"></div>
    </div>
    <div id="overlay">
      <h1>Heavy Ball</h1>
      <p>Guide the ball to the finish</p>
      <div id="overlay-buttons">
        <button class="overlay-btn" id="btn-start">Start</button>
      </div>
      <div id="overlay-time" style="margin-top:16px; font-size:20px; display:none;"></div>
      <div id="leaderboard-panel"></div>
      <div id="stats-panel"></div>
    </div>
    <div id="controls-hint">WASD / Arrow Keys to move</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
